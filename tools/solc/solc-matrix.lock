# Pinned solc compilers for the Yul lowering matrix (docs/SOLC_VYPER_PLAN.md, Steps 1-4 and 6).
# One line per compiler: version, binary file name on binaries.soliditylang.org/linux-amd64,
# sha256 of the binary (from that directory's list.json), EVM target, extra columns.
# The EVM target is the newest fork the compiler accepts that this project's EVM runs: cancun from
# 0.8.24 on; shanghai (0.8.20-0.8.23) and london (older) are subsets of cancun with the same prices.
# Extra columns: `-` for none, `ssa` for the experimental `--via-ssa-cfg` code generator.
# `gen_solc_fixtures.py` downloads each binary into a cache outside the repository and refuses it on
# a hash mismatch. The last line is the pinned "latest".
